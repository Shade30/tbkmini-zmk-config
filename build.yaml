# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
# Firmware files appear in GitHub -> Actions -> latest run -> Artifacts
include:
  - board: nice_nano_v2
    shield: tbkmini_left
  - board: nice_nano_v2
    # Right half is the central (connects to the PC) and has ZMK Studio enabled
    shield: tbkmini_right
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    # Flash settings_reset to both halves if they stop pairing, then flash normal firmware again
    shield: settings_reset
