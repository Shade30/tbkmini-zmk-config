# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
# Готовые файлы прошивки: GitHub -> Actions -> последний запуск -> Artifacts
include:
  - board: nice_nano_v2
    shield: tbkmini_left
  - board: nice_nano_v2
    # Правая половина — главная (подключается к компьютеру), в ней включён ZMK Studio
    shield: tbkmini_right
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    # Если половины перестали соединяться: прошить settings_reset в обе, затем снова обычную прошивку
    shield: settings_reset
