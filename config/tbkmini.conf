# Bluetooth TX power +8 dBm: better range, slightly higher battery drain
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Experimental BLE connection handling: helps with some hosts' connection issues
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Report the peripheral (left) half battery level to the host as well
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Uncomment to put the keyboard into deep sleep after 15 min idle (saves battery)
# CONFIG_ZMK_SLEEP=y
