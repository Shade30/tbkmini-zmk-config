# Мощность Bluetooth +8 дБм: дальше связь, чуть больше расход батареи
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Экспериментальная обработка BLE-соединений: помогает при проблемах с подключением к некоторым устройствам
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Передавать компьютеру ещё и заряд левой половины
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Раскомментировать, чтобы клавиатура засыпала после 15 мин простоя (экономит батарею)
# CONFIG_ZMK_SLEEP=y

# Мышиные клавиши (курсор, клики, прокрутка) на слое 1
CONFIG_ZMK_POINTING=y
